<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; connect-src 'self' http://localhost:5000 https://generativelanguage.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none';" />
    <title>CV Chatbot | Juan Pablo Cintioli</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
  </head>
  <body class="bg-slate-100 text-slate-800 antialiased">
    <div class="min-h-screen px-4 py-6 sm:px-6 lg:px-8">
      <div class="mx-auto max-w-6xl overflow-hidden rounded-3xl border border-slate-200 bg-white shadow-soft">
        <header class="border-b border-slate-200 bg-slate-50 px-4 py-4 sm:px-6">
          <div class="flex items-center justify-between gap-4">
            <div class="flex items-center gap-3 sm:gap-4">
              <div class="flex h-12 w-12 items-center justify-center rounded-2xl bg-gradient-to-br from-blue-600 to-sky-500 text-lg font-bold text-white shadow-lg shadow-blue-600/20">
                J
              </div>
              <div>
                <span class="mb-1 inline-flex items-center rounded-full bg-blue-100 px-2.5 py-1 text-[10px] font-semibold uppercase tracking-[0.2em] text-blue-700">
                  v3
                </span>
                <h1 class="text-lg font-bold tracking-tight text-slate-900 sm:text-xl">
                  Juan Pablo Cintioli
                </h1>
                <p class="text-xs text-slate-600 sm:text-sm">
                  CV Assistant · QA Automation Engineer · SDET
                </p>
              </div>
            </div>

            <div class="flex items-center gap-2 sm:gap-3">
              <a href="https://www.linkedin.com/in/juan-pablo-cintioli-sdet" target="_blank" rel="noreferrer" class="inline-flex items-center rounded-full border border-slate-200 bg-white px-3 py-2 text-xs font-medium text-slate-700 transition hover:border-blue-200 hover:text-blue-700">
                LinkedIn
              </a>
              <a href="https://github.com/" target="_blank" rel="noreferrer" class="inline-flex items-center rounded-full border border-slate-200 bg-white px-3 py-2 text-xs font-medium text-slate-700 transition hover:border-blue-200 hover:text-blue-700">
                GitHub
              </a>
            </div>
          </div>
        </header>

        <main class="bg-slate-50 p-3 sm:p-4">
          <div id="chatMessages" class="chat-scrollbar flex h-[62vh] min-h-[420px] flex-col gap-4 overflow-y-auto rounded-2xl border border-slate-200 bg-white p-3 sm:p-5" aria-live="polite"></div>
        </main>

        <footer class="border-t border-slate-200 bg-white px-3 pb-3 pt-4 sm:px-5 sm:pb-5">
          <div id="typingIndicator" class="mb-3 hidden items-center gap-2 text-sm text-slate-500">
            <span class="flex gap-1">
              <span class="h-2 w-2 animate-bounce rounded-full bg-blue-500 [animation-delay:-0.3s]"></span>
              <span class="h-2 w-2 animate-bounce rounded-full bg-blue-500 [animation-delay:-0.15s]"></span>
              <span class="h-2 w-2 animate-bounce rounded-full bg-blue-500"></span>
            </span>
            <span>Juan Pablo está escribiendo...</span>
          </div>

          <form id="chatForm" class="flex items-end gap-3">
            <label class="sr-only" for="userInput">Escribe tu pregunta</label>
            <textarea id="userInput" rows="1" class="max-h-32 min-h-[52px] flex-1 resize-none rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm text-slate-800 placeholder:text-slate-400 focus:border-blue-400 focus:outline-none focus:ring-4 focus:ring-blue-100" placeholder="Pregunta sobre mi experiencia, stack, certificaciones o CV..."></textarea>
            <button id="sendButton" type="submit" class="inline-flex h-[52px] items-center justify-center rounded-2xl bg-blue-600 px-5 text-sm font-semibold text-white shadow-lg shadow-blue-600/20 transition hover:bg-blue-700 disabled:cursor-not-allowed disabled:bg-slate-400">Enviar</button>
          </form>
        </footer>
      </div>
    </div>

    <script src="{{ url_for('static', filename='app.js') }}"></script>
  </body>
</html>
