<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CV Chatbot | Juan Pablo Cintioli</title>
    <meta
      name="description"
      content="Chatbot interactivo que responde como Juan Pablo Cintioli, QA Automation Engineer / SDET."
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              primary: {
                50: '#eff6ff',
                100: '#dbeafe',
                200: '#bfdbfe',
                300: '#93c5fd',
                400: '#60a5fa',
                500: '#3b82f6',
                600: '#2563eb',
                700: '#1d4ed8',
                800: '#1e40af',
                900: '#1e3a8a',
              },
            },
            boxShadow: {
              soft: '0 10px 30px rgba(15, 23, 42, 0.08)',
            },
          },
        },
      };
    </script>
    <style>
      :root {
        --bg: #f4f7fb;
        --bg-strong: #edf3fb;
        --panel: rgba(255, 255, 255, 0.78);
        --panel-strong: #ffffff;
        --panel-alt: #f8fafc;
        --surface: #eff6ff;
        --text: #0f172a;
        --muted: #475569;
        --border: rgba(148, 163, 184, 0.32);
        --shadow: rgba(15, 23, 42, 0.1);
        --user: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
        --bot: rgba(255, 255, 255, 0.9);
        --tag: rgba(37, 99, 235, 0.08);
        --tag-text: #1d4ed8;
      }

      html.dark {
        --bg: #020817;
        --bg-strong: #0f172a;
        --panel: rgba(15, 23, 42, 0.82);
        --panel-strong: #0b1220;
        --panel-alt: #111827;
        --surface: #101b2d;
        --text: #e2e8f0;
        --muted: #a5b4c9;
        --border: rgba(148, 163, 184, 0.18);
        --shadow: rgba(2, 6, 23, 0.6);
        --user: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
        --bot: rgba(15, 23, 42, 0.9);
        --tag: rgba(59, 130, 246, 0.12);
        --tag-text: #bfdbfe;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background:
          radial-gradient(circle at top left, rgba(59, 130, 246, 0.18), transparent 28%),
          radial-gradient(circle at bottom right, rgba(14, 165, 233, 0.12), transparent 32%),
          var(--bg);
        color: var(--text);
      }

      .glass-panel {
        background: var(--panel);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        border: 1px solid var(--border);
        box-shadow: 0 24px 60px var(--shadow);
      }

      .chat-scrollbar::-webkit-scrollbar {
        width: 10px;
      }

      .chat-scrollbar::-webkit-scrollbar-track {
        background: transparent;
      }

      .chat-scrollbar::-webkit-scrollbar-thumb {
        background: rgba(148, 163, 184, 0.45);
        border-radius: 9999px;
      }

      .message-bubble {
        max-width: min(82%, 760px);
        word-break: break-word;
      }

      .soft-ring {
        box-shadow: 0 0 0 1px rgba(59, 130, 246, 0.12), 0 12px 30px rgba(37, 99, 235, 0.12);
      }

      .avatar-shell {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 520px;
      }

      .avatar-device {
        position: relative;
        display: flex;
        width: min(100%, 320px);
        min-height: 500px;
        flex-direction: column;
        align-items: center;
        justify-content: flex-end;
        padding-top: 18px;
      }

      .avatar-screen {
        position: relative;
        display: flex;
        align-items: flex-end;
        justify-content: center;
        width: 240px;
        height: 190px;
        border-radius: 22px;
        border: 1px solid rgba(148, 163, 184, 0.28);
        background: linear-gradient(180deg, rgba(14, 116, 144, 0.12), rgba(15, 23, 42, 0.72));
        box-shadow: inset 0 0 0 1px rgba(255,255,255,0.12), 0 20px 35px rgba(15, 23, 42, 0.12);
        overflow: hidden;
      }

      .avatar-screen::before {
        content: '';
        position: absolute;
        inset: 10px;
        border-radius: 16px;
        background: linear-gradient(180deg, rgba(255,255,255,0.08), rgba(15,23,42,0.24));
        border: 1px solid rgba(255,255,255,0.08);
      }

      .avatar-bubble {
        position: absolute;
        top: 18px;
        left: 50%;
        z-index: 3;
        padding: 8px 12px;
        border-radius: 999px;
        background: rgba(15, 23, 42, 0.8);
        color: white;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        transform: translateX(-50%) translateY(-6px);
        opacity: 0;
        transition: opacity 0.2s ease, transform 0.2s ease;
      }

      .avatar-shell.working .avatar-screen {
        animation: screenPulse 2.4s ease-in-out infinite alternate;
      }

      .avatar-shell.speaking .avatar-bubble {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }

      .avatar-head {
        position: absolute;
        left: 50%;
        top: 28px;
        width: 110px;
        height: 110px;
        transform: translateX(-50%);
        border-radius: 50%;
        overflow: hidden;
        border: 4px solid rgba(255,255,255,0.75);
        box-shadow: 0 18px 36px rgba(30, 41, 59, 0.2);
        z-index: 2;
        transition: transform 0.25s ease;
      }

      .avatar-head img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      .avatar-body {
        position: absolute;
        left: 50%;
        bottom: 10px;
        width: 118px;
        height: 120px;
        transform: translateX(-50%);
        border-radius: 26px 26px 14px 14px;
        background: linear-gradient(180deg, rgba(59,130,246,0.2), rgba(15, 23, 42, 0.78));
        border: 1px solid rgba(148, 163, 184, 0.25);
        z-index: 1;
      }

      .avatar-mouth {
        position: absolute;
        left: 50%;
        bottom: 10px;
        width: 30px;
        height: 14px;
        transform: translateX(-50%);
        border-bottom: 4px solid rgba(15, 23, 42, 0.8);
        border-radius: 0 0 20px 20px;
        transition: height 0.12s ease, border-width 0.12s ease;
      }

      .avatar-shell.speaking .avatar-head {
        transform: translateX(-50%) rotate(-2deg);
      }

      .avatar-shell.speaking .avatar-mouth {
        height: 22px;
        border-bottom-width: 6px;
      }

      .avatar-shell.speaking .avatar-head img {
        animation: headPulse 0.35s ease-in-out infinite alternate;
      }

      .avatar-shell.working .avatar-device {
        animation: avatarBob 1.6s ease-in-out infinite alternate;
      }

      .avatar-base {
        position: relative;
        width: 280px;
        height: 34px;
        margin-top: -6px;
        border-radius: 0 0 20px 20px;
        background: linear-gradient(180deg, rgba(15, 23, 42, 0.88), rgba(30, 41, 59, 0.96));
        border: 1px solid rgba(148,163,184,0.15);
        box-shadow: 0 20px 40px rgba(15, 23, 42, 0.15);
        overflow: hidden;
      }

      .avatar-base::before {
        content: '';
        position: absolute;
        left: 18px;
        right: 18px;
        top: 10px;
        height: 10px;
        border-radius: 999px;
        background: linear-gradient(90deg, rgba(255,255,255,0.8), rgba(148,163,184,0.4), rgba(255,255,255,0.8));
        opacity: 0.85;
        background-size: 220% 100%;
        animation: keyboardShimmer 2.4s linear infinite;
      }

      .avatar-base::after {
        content: '';
        position: absolute;
        left: 50%;
        bottom: -12px;
        width: 210px;
        height: 18px;
        transform: translateX(-50%);
        border-radius: 50%;
        background: rgba(15, 23, 42, 0.18);
        filter: blur(14px);
      }

      @keyframes avatarBob {
        0% { transform: translateY(0); }
        100% { transform: translateY(-6px); }
      }

      @keyframes screenPulse {
        0% { box-shadow: inset 0 0 0 1px rgba(255,255,255,0.12), 0 20px 35px rgba(15, 23, 42, 0.12); }
        100% { box-shadow: inset 0 0 0 1px rgba(96,165,250,0.25), 0 24px 40px rgba(59,130,246,0.18); }
      }

      @keyframes headPulse {
        0% { transform: translateX(-50%) scale(1); }
        100% { transform: translateX(-50%) scale(1.03); }
      }

      @keyframes keyboardShimmer {
        0% { background-position: 0% 50%; }
        100% { background-position: 200% 50%; }
      }
    </style>
  </head>
  <body class="antialiased transition-colors duration-300">
    <div class="mx-auto min-h-screen max-w-7xl px-4 py-6 sm:px-6 lg:px-8">
      <div class="glass-panel overflow-hidden rounded-[30px] border">
        <header class="border-b border-[color:var(--border)] bg-[color:var(--panel-alt)]/90 px-4 py-4 sm:px-6 lg:px-8">
          <div class="flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">
            <div class="flex items-center gap-4">
              <div class="flex h-14 w-14 items-center justify-center rounded-2xl bg-gradient-to-br from-brand-600 via-blue-500 to-cyan-400 text-xl font-bold text-white shadow-lg shadow-brand-500/30">
                J
              </div>
              <div>
                <p class="text-[11px] font-medium uppercase tracking-[0.22em] text-slate-500 dark:text-slate-400">
                  Portfolio
                </p>
                <h1 class="text-lg font-bold tracking-tight text-[color:var(--text)] sm:text-2xl">
                  Juan Pablo Cintioli
                </h1>
                <p class="text-sm text-[color:var(--muted)]">
                  QA Automation Engineer · SDET
                </p>
              </div>
            </div>

            <div class="flex items-center gap-2 sm:gap-3">
              <a
                href="https://www.linkedin.com/in/juan-pablo-cintioli-sdet"
                target="_blank"
                rel="noreferrer"
                class="inline-flex items-center rounded-full border border-[color:var(--border)] bg-white/70 px-3 py-2 text-xs font-semibold text-slate-700 transition hover:-translate-y-0.5 hover:border-brand-300 hover:text-brand-700 dark:bg-slate-900/70 dark:text-slate-200 dark:hover:text-brand-300"
              >
                LinkedIn
              </a>
              <a
                href="https://github.com/juanpici"
                target="_blank"
                rel="noreferrer"
                class="inline-flex items-center rounded-full border border-[color:var(--border)] bg-white/70 px-3 py-2 text-xs font-semibold text-slate-700 transition hover:-translate-y-0.5 hover:border-brand-300 hover:text-brand-700 dark:bg-slate-900/70 dark:text-slate-200 dark:hover:text-brand-300"
              >
                GitHub
              </a>
              <button
                id="themeToggle"
                type="button"
                aria-label="Cambiar tema"
                class="inline-flex h-11 w-11 items-center justify-center rounded-full border border-[color:var(--border)] bg-white/80 text-lg transition hover:-translate-y-0.5 hover:border-brand-300 hover:text-brand-700 dark:bg-slate-900/80 dark:text-slate-200"
              >
                ☀️
              </button>
            </div>
          </div>
        </header>

        <main class="bg-[color:var(--bg-strong)] p-3 sm:p-4 lg:p-5">
          <div class="grid gap-4 lg:grid-cols-[minmax(0,1.4fr)_320px]">
            <div
              id="chatMessages"
              class="chat-scrollbar flex h-[62vh] min-h-[420px] flex-col gap-4 overflow-y-auto rounded-[26px] border border-[color:var(--border)] bg-[color:var(--panel-strong)] p-3 sm:p-5"
              aria-live="polite"
            ></div>

            <aside class="avatar-shell working" id="avatarShell" aria-label="Avatar del asistente">
              <div class="avatar-device">
                <div class="avatar-screen">
                  <div class="avatar-bubble">Hablando</div>
                  <div class="avatar-body"></div>
                  <div class="avatar-head">
                    <img
                      src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=800&q=80"
                      alt="Juan Pablo Cintioli"
                    />
                    <div class="avatar-mouth"></div>
                  </div>
                </div>
                <div class="avatar-base"></div>
              </div>
            </aside>
          </div>
        </main>

        <footer class="border-t border-[color:var(--border)] bg-[color:var(--panel)] px-3 pb-3 pt-4 sm:px-5 sm:pb-5">
          <div id="typingIndicator" class="mb-3 hidden items-center gap-2 text-sm text-[color:var(--muted)]">
            <span class="flex gap-1.5">
              <span class="h-2.5 w-2.5 animate-bounce rounded-full bg-brand-500 [animation-delay:-0.3s]"></span>
              <span class="h-2.5 w-2.5 animate-bounce rounded-full bg-brand-500 [animation-delay:-0.15s]"></span>
              <span class="h-2.5 w-2.5 animate-bounce rounded-full bg-brand-500"></span>
            </span>
            <span>Juan Pablo está escribiendo...</span>
          </div>

          <div class="mb-3 flex flex-wrap gap-2 text-[11px] font-medium text-[color:var(--tag-text)]">
            <span class="rounded-full bg-[color:var(--tag)] px-2.5 py-1.5">Playwright</span>
            <span class="rounded-full bg-[color:var(--tag)] px-2.5 py-1.5">Selenium</span>
            <span class="rounded-full bg-[color:var(--tag)] px-2.5 py-1.5">Java</span>
            <span class="rounded-full bg-[color:var(--tag)] px-2.5 py-1.5">CI/CD</span>
          </div>

          <form id="chatForm" class="flex items-end gap-3">
            <label class="sr-only" for="userInput">Escribe tu pregunta</label>
            <textarea
              id="userInput"
              rows="1"
              class="soft-ring max-h-32 min-h-[56px] flex-1 resize-none rounded-2xl border border-[color:var(--border)] bg-[color:var(--panel-alt)] px-4 py-3 text-sm text-[color:var(--text)] placeholder:text-slate-400 focus:border-brand-400 focus:outline-none focus:ring-4 focus:ring-brand-100 dark:placeholder:text-slate-500 dark:focus:ring-brand-500/20"
              placeholder="Pregunta sobre mi experiencia, stack, certificaciones o CV..."
            ></textarea>

            <button
              id="sendButton"
              type="submit"
              class="inline-flex h-[56px] items-center justify-center rounded-2xl bg-gradient-to-r from-brand-600 to-blue-500 px-5 text-sm font-semibold text-white shadow-lg shadow-brand-500/25 transition hover:-translate-y-0.5 hover:shadow-brand-500/35 disabled:cursor-not-allowed disabled:opacity-70"
            >
              Enviar
            </button>
          </form>
        </footer>
      </div>
    </div>

    <script>
      const PROFILE_PHOTO_URL = 'https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=800&q=80';
      const chatMessages = document.getElementById('chatMessages');
      const chatForm = document.getElementById('chatForm');
      const userInput = document.getElementById('userInput');
      const sendButton = document.getElementById('sendButton');
      const typingIndicator = document.getElementById('typingIndicator');
      const themeToggle = document.getElementById('themeToggle');
      const avatarShell = document.getElementById('avatarShell');
      const avatarImage = document.querySelector('.avatar-head img');

      avatarImage.src = PROFILE_PHOTO_URL;

      let isLoading = false;

      function setAvatarSpeaking(isSpeaking) {
        avatarShell.classList.toggle('speaking', isSpeaking);
        avatarShell.classList.toggle('working', !isSpeaking);
        const label = isSpeaking ? 'Hablando' : 'Trabajando';
        const bubble = avatarShell.querySelector('.avatar-bubble');
        if (bubble) bubble.textContent = label;
      }

      function applyTheme(theme) {
        const root = document.documentElement;
        const isDark = theme === 'dark';
        root.classList.toggle('dark', isDark);
        themeToggle.textContent = isDark ? '☀️' : '🌙';
        localStorage.setItem('cv-chatbot-theme', theme);
      }

      function initTheme() {
        const savedTheme = localStorage.getItem('cv-chatbot-theme');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        applyTheme(savedTheme || (prefersDark ? 'dark' : 'light'));
      }

      function scrollToBottom() {
        chatMessages.scrollTop = chatMessages.scrollHeight;
      }

      function escapeHtml(value) {
        return String(value)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      function addMessage(role, text) {
        const wrapper = document.createElement('div');
        wrapper.className = `flex ${role === 'user' ? 'justify-end' : 'justify-start'}`;

        const bubble = document.createElement('div');
        bubble.className = `message-bubble rounded-[22px] px-4 py-3 text-sm leading-relaxed shadow-sm ${
          role === 'user'
            ? 'bg-gradient-to-br from-brand-600 to-blue-500 text-white'
            : 'border border-[color:var(--border)] bg-[color:var(--bot)] text-[color:var(--text)]'
        }`;
        bubble.innerHTML = `<div class="whitespace-pre-wrap">${escapeHtml(text || '')}</div>`;

        wrapper.appendChild(bubble);
        chatMessages.appendChild(wrapper);
        scrollToBottom();
      }

      function addInfoNotice(message) {
        const wrapper = document.createElement('div');
        wrapper.className = 'flex justify-center';

        const bubble = document.createElement('div');
        bubble.className = 'message-bubble rounded-2xl border border-amber-200 bg-amber-50 px-4 py-3 text-xs font-medium text-amber-700 dark:border-amber-500/30 dark:bg-amber-500/10 dark:text-amber-200';
        bubble.textContent = message;

        wrapper.appendChild(bubble);
        chatMessages.appendChild(wrapper);
        scrollToBottom();
      }

      function setLoadingState(loading) {
        isLoading = loading;
        typingIndicator.classList.toggle('hidden', !loading);
        sendButton.disabled = loading;
        userInput.disabled = loading;
        userInput.placeholder = loading ? 'Estoy preparando la respuesta...' : 'Pregunta sobre mi experiencia, stack, certificaciones o CV...';
      }

      async function sendMessage() {
        const message = userInput.value.trim();
        if (!message || isLoading) return;

        addMessage('user', message);
        userInput.value = '';
        setLoadingState(true);
        setAvatarSpeaking(true);

        try {
          const response = await fetch('/api/chat', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
            },
            body: JSON.stringify({ message }),
          });

          const data = await response.json();

          if (!response.ok) {
            throw new Error(data.error || 'No se pudo obtener la respuesta.');
          }

          addMessage('assistant', data.reply);
        } catch (error) {
          addMessage('assistant', `Lo siento, no pude responder ahora mismo: ${error.message}`);
        } finally {
          setLoadingState(false);
          setAvatarSpeaking(false);
          userInput.focus();
        }
      }

      chatForm.addEventListener('submit', (event) => {
        event.preventDefault();
        sendMessage();
      });

      userInput.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' && !event.shiftKey) {
          event.preventDefault();
          sendMessage();
        }
      });

      themeToggle.addEventListener('click', () => {
        const nextTheme = document.documentElement.classList.contains('dark') ? 'light' : 'dark';
        applyTheme(nextTheme);
      });

      const welcomeText = '¡Hola! Soy el asistente virtual de Juan Pablo. Puedes preguntarme sobre su experiencia con Selenium, Playwright, sus certificaciones o cualquier detalle de su CV. ¿Qué te gustaría saber?';
      addMessage('assistant', welcomeText);
      addInfoNotice('La app está optimizada para una experiencia profesional y elegante tanto en modo claro como en oscuro.');
      setAvatarSpeaking(false);
      initTheme();
      userInput.focus();
    </script>
  </body>
</html>
